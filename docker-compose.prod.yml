name: semantic-engine-prod

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ses}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}"
      POSTGRES_DB: "${POSTGRES_DB:-ses_gateway}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ses-internal

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - ses-internal

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      DEBUG: "false"
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-ses_gateway}"
      POSTGRES_USER: "${POSTGRES_USER:-ses}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}"
      GATEWAY_ADMIN_KEY: "${GATEWAY_ADMIN_KEY:?Set GATEWAY_ADMIN_KEY in .env.prod}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}"
      GATEWAY_CORS_ORIGINS: "${GATEWAY_CORS_ORIGINS:-http://127.0.0.1:3000}"
      STRIPE_API_KEY: "${STRIPE_API_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_DEVELOPER: "${STRIPE_PRICE_DEVELOPER:-}"
      STRIPE_PRICE_GROWTH: "${STRIPE_PRICE_GROWTH:-}"
      STRIPE_CREDITS_DEVELOPER: "${STRIPE_CREDITS_DEVELOPER:-10000}"
      STRIPE_CREDITS_GROWTH: "${STRIPE_CREDITS_GROWTH:-100000}"
      BILLING_SUCCESS_URL: "${BILLING_SUCCESS_URL:-http://127.0.0.1:3000/billing/success}"
      BILLING_CANCEL_URL: "${BILLING_CANCEL_URL:-http://127.0.0.1:3000/billing}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ses-internal

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SES_API_URL: "${NEXT_PUBLIC_SES_API_URL:-http://localhost:8000}"
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_SES_API_URL: "${NEXT_PUBLIC_SES_API_URL:-http://localhost:8000}"
    depends_on:
      - gateway
    networks:
      - ses-internal

networks:
  ses-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
