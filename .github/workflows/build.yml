name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin and build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin build

    - name: Build wheel (sdist and wheel)
      run: maturin build --release

    - name: Install package in editable mode with extras
      run: pip install -e ".[dev,server]"

    - name: Run Pytest
      run: |
        pytest tests/
      continue-on-error: true # Tests might need ONNX model, which we don't download here yet
