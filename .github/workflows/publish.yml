name: Package and Publish Core (PyPI & Crates.io)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify package and tag parity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/validate_release.py --tag "$RELEASE_TAG"
      - name: Validate crates.io release preflight
        run: python scripts/check_crate_publication.py --allow-missing

  build-linux-wheels:
    name: Build Linux wheel (${{ matrix.target }})
    needs: validate-release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ses-core-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-windows-wheel:
    name: Build Windows wheel (x64)
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ses-core-windows-x64
          path: dist/*.whl
          if-no-files-found: error

  build-macos-wheels:
    name: Build macOS wheel (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ses-core-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist-and-crate:
    name: Build sdist and verify standalone crate
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate standalone Rust crate
        run: |
          cargo fmt --manifest-path core_rs/Cargo.toml -- --check
          cargo test --manifest-path core_rs/Cargo.toml --locked
          cargo clippy --manifest-path core_rs/Cargo.toml --all-targets --locked -- -D warnings
          cargo publish --manifest-path core_rs/Cargo.toml --locked --dry-run
      - name: Build ses-core source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v6
        with:
          name: ses-core-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-artifacts:
    name: Verify release artifacts
    needs:
      - build-linux-wheels
      - build-windows-wheel
      - build-macos-wheels
      - build-sdist-and-crate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: ses-core-*
          path: dist
          merge-multiple: true
      - name: Inspect and smoke-test distributions
        run: |
          python -m pip install --upgrade pip twine numpy
          python -m twine check dist/*
          python scripts/verify_release_artifacts.py dist --require-platforms
          LINUX_WHEEL=$(find dist -maxdepth 1 -name '*manylinux*x86_64.whl' | head -n 1)
          test -n "$LINUX_WHEEL"
          python -m pip install --no-deps "$LINUX_WHEEL"
          python -c "import numpy as np, ses, jas_vector_core as j; q=np.array([1.0,0.0],dtype=np.float32); d=np.array([[0.0,1.0],[1.0,0.0]],dtype=np.float32); assert j.cosine_similarity_search_numpy(q,d,1)[0][0] == 1"

  publish-pypi:
    name: Publish ses-core to PyPI via OIDC
    if: github.event_name == 'release'
    needs: verify-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ses-core
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: ses-core-*
          path: dist
          merge-multiple: true
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crates:
    name: Publish jas_vector_core to Crates.io
    if: github.event_name == 'release'
    needs: verify-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Require crates.io publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required for a release publication."
            exit 1
          fi
      - name: Publish standalone crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          CRATE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('core_rs/Cargo.toml', 'rb'))['package']['version'])")
          if python scripts/check_crate_publication.py --version "$CRATE_VERSION"; then
            echo "Crate version already exists; skipping publication."
          else
            CHECK_EXIT=$?
            if [ "$CHECK_EXIT" = "3" ]; then
              cargo publish --manifest-path core_rs/Cargo.toml --locked
            else
              exit "$CHECK_EXIT"
            fi
          fi

  attach-release-assets:
    name: Attach verified artifacts to GitHub Release
    if: github.event_name == 'release'
    needs: [publish-pypi, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: ses-core-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY"
